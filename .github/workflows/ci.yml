name: CI

on:
  push:
    branches: [main]
  # Every pull request, so stacked PRs whose base is another PR's branch are checked too.
  pull_request:
  # Any branch on demand, so a cloud session can check app code on macOS before opening a PR.
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (for swift format)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run checks
        run: scripts/check.sh
