name: CI

on:
  push:
    branches: [main]
  # Every pull request, so stacked PRs whose base is another PR's branch are checked too.
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (for swift format)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: TEMP dump app icon
        run: |
          swift scripts/render-app-icon.swift /tmp/icon
          echo ICONSTART; tar -C /tmp/icon -czf - . | base64; echo ICONEND
      - name: Run checks
        run: scripts/check.sh
